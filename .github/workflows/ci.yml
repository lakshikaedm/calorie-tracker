name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm test
      - run: bin/rails test
      - run: bin/rails static:build
      - run: bundle exec ruby script/browser_test.rb
